[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "console-text-qr"
version = "0.1.0"
description = "Print a text file as a QR code in the console."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Masaaki Ikeda" }
]
dependencies = [
  "qrcode>=7.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
console-text-qr = "console_text_qr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
