[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "console-qr"
version = "0.1.0"
description = "Print a text file as a QR code in the console."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Masaaki Ikeda" }
]
dependencies = [
  "qrcode>=7.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
console-qr = "console_text_qr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["console_text_qr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
